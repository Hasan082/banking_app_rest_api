# MySQL profile. Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Database settings come from environment variables so no credentials are stored in the repository.
# Set DB_PASSWORD (and optionally DB_URL, DB_USERNAME) before running the app.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankapp}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
